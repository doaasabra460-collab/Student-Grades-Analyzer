<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Grades Analyzer</title>
</head>
<body>

    <h1>Student Grades Analyzer</h1>
    <p>Open Console to see the results.</p>

    <script>

        // 1. Student Class
        class Student {

            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

            // Calculate Average
            calculateAverage() {

                let total = this.grades.reduce(function(sum, grade) {
                    return sum + grade;
                }, 0);

                return total / this.grades.length;
            }

            // Get Grade Letter
            getGradeLetter(average) {

                if (average >= 90) {
                    return "A";
                }
                else if (average >= 80) {
                    return "B";
                }
                else if (average >= 70) {
                    return "C";
                }
                else if (average >= 60) {
                    return "D";
                }
                else if (average >= 50) {
                    return "E";
                }
                else {
                    return "F";
                }
            }

            // Get Final Result
            getFinalResult(average) {

                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                }
                else {
                    return "يحتاج مراجعة";
                }
            }
        }


        // 2. Create Students List
        const studentsList = [

            new Student(1, "Ahmed", [90, 85, 95], 90),

            new Student(2, "Sara", [45, 48, 42], 80),

            new Student(3, "Mohamed", [60, 55, 65], 70),

            new Student(4, "Mona", [40, 45, 48], 85)

        ];


        // 3. Print Students Reports
        console.log("===== Students Reports =====");

        for (let i = 0; i < studentsList.length; i++) {

            let student = studentsList[i];

            let average = student.calculateAverage();

            let grade = student.getGradeLetter(average);

            let result = student.getFinalResult(average);

            console.log("Student Name:", student.name);
            console.log("Average:", average.toFixed(2));
            console.log("Grade:", grade);
            console.log("Result:", result);
            console.log("----------------------");

        }


        // 4. Filter Struggling Students
        const strugglingStudents = studentsList.filter(function(student) {

            let average = student.calculateAverage();

            return average >= 40 && average <= 49;

        });


        // 5. Add 5 Grace Marks using map
        const graceStudents = strugglingStudents.map(function(student) {

            let oldAverage = student.calculateAverage();

            return {
                id: student.id,
                name: student.name,
                oldAverage: oldAverage,
                newAverage: oldAverage + 5
            };

        });


        console.log("===== Grace Students =====");

        console.log(graceStudents);


        // 6. Calculate Total New Averages using reduce
        const totalNewAverages = graceStudents.reduce(function(sum, student) {

            return sum + student.newAverage;

        }, 0);


        // 7. Calculate Grace Average
        let graceAverage = 0;

        if (graceStudents.length > 0) {

            graceAverage = totalNewAverages / graceStudents.length;

        }


        console.log("===== Grace Committee Results =====");

        console.log("Total New Averages:", totalNewAverages);

        console.log("Grace Average:", graceAverage.toFixed(2));


    </script>

</body>
</html>
